name: Validate Konsultan SLF Site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate_site:
    name: Validate site and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check AI content runtime syntax
        run: node --check scripts/update-content-ai.mjs
      - name: Type-check and build Astro site
        run: npm run build
