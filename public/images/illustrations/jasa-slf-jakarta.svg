<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi Jasa SLF Jakarta</title>
  <desc id="desc">Gedung perkantoran Jakarta dengan tanda kelaikan fungsi dan peta lokasi.</desc>
  <rect x="24" y="20" width="512" height="320" rx="26" fill="#F0FDFA"/>
  
  <!-- Jakarta Skyline Silhouette -->
  <path d="M60 280h440v-40H440v-60h-40v-80h-60v40h-40V60h-60v120h-40v60h-40v40H60v40Z" fill="#CCFBF1"/>
  
  <!-- Main Office Building -->
  <rect x="200" y="100" width="160" height="180" rx="4" fill="#fff" stroke="#0D9488" stroke-width="7"/>
  <path d="M225 130h30m-30 30h30m-30 30h30m-30 30h30m55-120h30m-30 30h30m-30 30h30m-30 30h30" stroke="#99F6E4" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Location/Jakarta Indicator -->
  <circle cx="420" cy="120" r="35" fill="#FEF2F2" stroke="#EF4444" stroke-width="6"/>
  <path d="M420 100c-8 0-15 7-15 15 0 11 15 25 15 25s15-14 15-25c0-8-7-15-15-15Z" fill="#FEE2E2" stroke="#EF4444" stroke-width="4"/>
  <circle cx="420" cy="115" r="4" fill="#EF4444"/>
  
  <!-- Certification/Checkmark Badge -->
  <circle cx="140" cy="220" r="45" fill="#DCFCE7" stroke="#16A34A" stroke-width="6"/>
  <path d="M120 220l15 15 25-30" stroke="#15803D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Document/SLF Text Lines -->
  <path d="M220 250h120m-120 15h80" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>
</svg>