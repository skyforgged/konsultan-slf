<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Konsultan SLF &amp; PBG</title>
  <desc id="desc">Pendampingan perizinan bangunan, Sertifikat Laik Fungsi, dan Persetujuan Bangunan Gedung.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="250" fill="#2563eb" opacity=".16"/>
  <circle cx="1120" cy="590" r="280" fill="#38bdf8" opacity=".08"/>
  <rect x="88" y="94" width="100" height="100" rx="22" fill="#2563eb"/>
  <text x="138" y="157" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" text-anchor="middle">SLF</text>
  <text x="88" y="286" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="800">Konsultan SLF &amp; PBG</text>
  <text x="90" y="354" fill="url(#accent)" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">Pendampingan perizinan bangunan</text>
  <text x="90" y="416" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="25">Sertifikat Laik Fungsi (SLF)</text>
  <text x="90" y="456" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="25">Persetujuan Bangunan Gedung (PBG)</text>
  <path d="M90 520 H420" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <text x="90" y="566" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="20">Informasi layanan dan persiapan dokumen bangunan</text>
</svg>
